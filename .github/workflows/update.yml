name: Update market data
on:
  schedule:
    - cron: "30 22 * * 1-5"   # weekdays, 22:30 UTC (after US market close)
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch data
        run: node scripts/update.mjs
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "market-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Update market data"
          git push
